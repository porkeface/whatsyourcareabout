# Proxy for accessing blocked sites (set to null to disable)
proxy: "${HTTPS_PROXY}"

sources:
  hacker_news:
    enabled: true
    weight: 1.0
    max_items: 20
  reddit:
    enabled: false
    weight: 1.0
    subreddits: ["MachineLearning", "artificial", "technology"]
    max_items: 20
  arxiv:
    enabled: true
    weight: 1.2
    categories: ["cs.AI", "cs.CL", "cs.CV", "cs.LG"]
    max_items: 15
  github_trending:
    enabled: true
    weight: 0.8
    languages: ["python", "typescript", "rust"]
    max_items: 15
  rss:
    enabled: true
    weight: 0.9
    feeds:
      # English sources
      - name: "TechCrunch"
        url: "https://techcrunch.com/feed/"
        domain: "tech"
      - name: "Hugging Face Blog"
        url: "https://huggingface.co/blog/feed.xml"
        domain: "ai"
      # Chinese sources
      - name: "36氪"
        url: "https://36kr.com/feed"
        domain: "tech"
      - name: "少数派"
        url: "https://sspai.com/feed"
        domain: "tech"
      - name: "虎嗅"
        url: "https://www.huxiu.com/rss/0.xml"
        domain: "tech"
      - name: "IT之家"
        url: "https://www.ithome.com/rss/"
        domain: "tech"
      - name: "爱范儿"
        url: "https://www.ifanr.com/feed"
        domain: "tech"
      - name: "Solidot"
        url: "https://www.solidot.org/index.rss"
        domain: "tech"
    max_items: 30
  newsapi:
    enabled: true
    weight: 0.6
    api_key: "${NEWSAPI_KEY}"
    queries: ["artificial intelligence", "stock market", "technology"]
    max_items: 20
  finnhub:
    enabled: true
    weight: 0.6
    api_key: "${FINNHUB_KEY}"
    max_items: 15
  rsshub:
    enabled: false
    weight: 0.9
    base_url: "https://rsshub.app"
    routes:
      - name: "知乎热榜"
        path: "/zhihu/hotlist"
        domain: "social"
      - name: "B站热门"
        path: "/bilibili/ranking"
        domain: "social"
      - name: "微博热搜"
        path: "/weibo/search/hot"
        domain: "social"
      - name: "36氪快讯"
        path: "/36kr/newsflashes"
        domain: "tech"
      - name: "少数派热榜"
        path: "/sspai/hot"
        domain: "tech"
    max_items: 20
  dailyhot:
    enabled: true
    weight: 0.9
    base_url: "${DAILYHOT_API_URL}"
    routes:
      - name: "B站热门"
        path: "/bilibili"
        domain: "tech"
      - name: "抖音热点"
        path: "/douyin"
        domain: "social"
      - name: "百度热搜"
        path: "/baidu"
        domain: "general"
      - name: "今日头条"
        path: "/toutiao"
        domain: "general"
      - name: "微博热搜"
        path: "/weibo"
        domain: "social"
      - name: "知乎热榜"
        path: "/zhihu"
        domain: "social"
    max_items: 30

processing:
  dedup_threshold: 0.85
  dedup_window_hours: 24
  recency_half_life_hours: 12
  max_items_per_domain: 10

ai_summary:
  enabled: true
  api_key: "${MIMO_API_KEY}"
  base_url: "${MIMO_BASE_URL}"
  model: "mimo-v2.5-pro"
  max_items_per_domain: 50

output:
  formats: ["markdown", "html"]
  output_dir: "./output"
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

schedule:
  cron_hour: 6
  cron_minute: 0
  timezone: "UTC"
