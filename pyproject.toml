[project]
name = "wyca"
version = "0.1.0"
description = "Daily Global Hot Topics Aggregator - Break information silos across domains"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "apscheduler>=3.10.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "trafilatura>=1.12.0",
]

[project.scripts]
wyca = "src.main:main"
